<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peach Hour · Share image</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
  /* Link-preview image (og:image), 1200x630. */
  html, body { margin: 0; }
  .og { width: 1200px; height: 630px; position: relative; overflow: hidden; color: #fff; font-family: Newsreader, Georgia, serif;
    background: radial-gradient(900px 520px at 78% 120%, rgba(255, 106, 61, .32), transparent 62%), radial-gradient(1500px 900px at 50% 125%, #4a2f5c 0%, #2b2a55 42%, #1b1f3b 74%); }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; -webkit-text-stroke: .02em currentColor; }
  .grad { background: linear-gradient(90deg, #ffb347, #ff6a3d); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0; font-style: italic; }
  .text { position: absolute; left: 72px; top: 70px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 40px; margin: 0; }
  .sun { width: 56px; height: 28px; border-radius: 56px 56px 0 0; background: linear-gradient(#ffb347 10%, #ff6a3d 80%);
    -webkit-mask: linear-gradient(#000 30%, transparent 30%), repeating-linear-gradient(to bottom, #000 0 5px, transparent 5px 8px);
    mask: linear-gradient(#000 30%, transparent 30%), repeating-linear-gradient(to bottom, #000 0 5px, transparent 5px 8px); mask-composite: add; }
  h1 { margin: 44px 0 0; font-size: 100px; line-height: .92; }
  p { margin: 30px 0 0; font-size: 28px; line-height: 1.4; color: rgba(255, 255, 255, .8); }
  .url { position: absolute; left: 72px; bottom: 56px; font-size: 26px; font-weight: 600; color: #ffb347; letter-spacing: .04em; }
  .pg { position: absolute; width: 270px; height: 340px; background: #fbfaf7; border-radius: 12px; padding: 10px; box-shadow: 0 26px 50px -18px rgba(0, 0, 0, .65); }
  .pg img { width: 100%; height: 260px; object-fit: cover; border-radius: 7px; display: block; }
  .pg span { display: block; text-align: center; margin-top: 16px; color: #141414; font-family: "Instrument Serif", serif; font-size: 32px; line-height: 1; -webkit-text-stroke: .02em currentColor; }
  .a { left: 690px; top: 150px; transform: rotate(-7deg); } .b { left: 880px; top: 120px; transform: rotate(5deg); z-index: 2; }
</style>
</head>
<body>
<div class="og">
  <div class="text">
    <p class="brand serif" style="margin:0;color:#fff"><span class="sun"></span>Peach Hour</p>
    <h1 class="serif">Find your<br><span class="grad">happy hour.</span></h1>
    <p>Every happy hour from Buckhead, to Inman Park, to VaHi, to Decatur.</p>
  </div>
  <div class="url">PEACHHOURATL.COM</div>
  <div class="pg a"><img src="/assets/venues/whiskey-bird-2.jpg" alt=""><span>Whiskey Bird</span></div>
  <div class="pg b"><img src="/assets/venues/south-city-midtown-2.jpg" alt=""><span>South City Kitchen</span></div>
</div>
</body>
</html>
